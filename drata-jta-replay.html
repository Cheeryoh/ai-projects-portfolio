<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Replay of an unapproved Drata Administrator JTA agent run." />
  <title>Drata Administrator JTA Run Replay | Justin Oh</title>
  <style>
    :root { color-scheme: dark; --bg:#080c0f; --panel:#11191e; --line:#26343c; --ink:#edf4f6; --muted:#91a0a8; --teal:#69e0c2; --gold:#e4b969; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 80% 10%,rgba(105,224,194,.1),transparent 32rem),var(--bg); color:var(--ink); font:16px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 28px; border-bottom:1px solid var(--line); }
    header a { color:var(--ink); text-decoration:none; font-weight:750; letter-spacing:.08em; }
    header span { color:var(--gold); font-size:.8rem; }
    main { width:min(calc(100% - 40px),1320px); margin:0 auto; padding:42px 0 60px; }
    .head { display:grid; grid-template-columns:1fr auto; gap:30px; align-items:end; }
    .eyebrow { color:var(--teal); font-size:.78rem; font-weight:760; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:8px 0 0; font-size:clamp(2.2rem,5vw,4.8rem); line-height:.98; letter-spacing:-.05em; }
    .run-meta { text-align:right; color:var(--muted); font: .8rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .progress { height:4px; margin:28px 0 34px; background:var(--line); overflow:hidden; border-radius:999px; }
    .progress > div { width:0; height:100%; background:linear-gradient(90deg,var(--teal),var(--gold)); transition:width .55s ease; }
    .layout { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(300px,.65fr); gap:18px; }
    .stages { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .stage { position:relative; min-height:112px; padding:17px 18px; background:var(--panel); border:1px solid var(--line); border-radius:10px; opacity:.48; transform:translateY(3px); transition:opacity .35s,transform .35s,border-color .35s,background .35s; }
    .stage.active { opacity:1; transform:none; border-color:var(--gold); background:linear-gradient(135deg,#17232a,#121a1f); }
    .stage.complete { opacity:.86; transform:none; border-color:rgba(105,224,194,.45); }
    .stage-id { color:var(--teal); font:700 .74rem ui-monospace,SFMono-Regular,Consolas,monospace; }
    .stage h2 { margin:20px 0 2px; font-size:1rem; }
    .stage p { margin:0; color:var(--muted); font-size:.82rem; }
    .stage .cost { position:absolute; top:15px; right:16px; color:var(--muted); font:.72rem ui-monospace,SFMono-Regular,Consolas,monospace; }
    .detail { min-height:100%; padding:25px; border:1px solid var(--line); border-radius:12px; background:linear-gradient(145deg,#121a1f,#0d1317); }
    .detail .label { color:var(--gold); font:.76rem ui-monospace,SFMono-Regular,Consolas,monospace; }
    .detail h2 { margin:12px 0; font-size:1.65rem; line-height:1.1; }
    .detail p { color:#bdc8cd; }
    .facts { margin:24px 0 0; padding:0; list-style:none; }
    .facts li { padding:11px 0; border-top:1px solid var(--line); color:var(--muted); font-size:.88rem; }
    .facts strong { color:var(--ink); }
    .footer-note { margin-top:18px; padding:12px 14px; color:#d4c5a5; background:rgba(228,185,105,.07); border-left:3px solid var(--gold); font-size:.82rem; }
    @media (max-width:1100px) { .stages { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:900px) { .layout,.head { grid-template-columns:1fr; } .run-meta { text-align:left; } }
    @media (max-width:600px) { header{padding:14px 18px}.stages{grid-template-columns:1fr}main{width:min(calc(100% - 24px),1320px);padding-top:28px} }
    @media (prefers-reduced-motion:reduce) { .stage,.progress>div{transition:none} }
  </style>
</head>
<body>
  <header><a href="index.html">JUSTIN OH</a><span>UNAPPROVED DRAFT RUN</span></header>
  <main>
    <div class="head">
      <div><div class="eyebrow">Multi-agent JTA replay</div><h1>Drata Administrator</h1></div>
      <div class="run-meta" id="run-meta">Loading run projection</div>
    </div>
    <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
    <div class="layout">
      <div class="stages" id="stages" aria-label="Pipeline stages"></div>
      <aside class="detail" aria-live="polite">
        <div class="label" id="detail-label">WAITING</div>
        <h2 id="detail-title">Loading the run</h2>
        <p id="detail-summary">Only a public, reviewed projection is shown here.</p>
        <ul class="facts" id="detail-facts"></ul>
        <div class="footer-note">No human approval gates were resolved in this rapid draft run. Simulated reviewers are labeled as simulated.</div>
      </aside>
    </div>
  </main>
  <script src="drata-jta-replay.js" defer></script>
</body>
</html>
